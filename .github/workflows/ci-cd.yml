# =====================================================================
# Pipeline CI/CD — Cidades ESGInteligentes (API de Gestão de Resíduos)
#
#   1. Build ──► 2. Testes ──► 3. Imagem Docker ──► 4. Deploy Staging ──► 5. Deploy Produção
#   (GitHub, ubuntu-24.04)                          (servidor self-hosted) (após aprovação manual)
#
# - Pull requests rodam só build + testes (validação, sem deploy).
# - Push na main roda o fluxo completo.
# - A MESMA imagem (tag sha-<commit>) é testada em staging e promovida
#   para produção: o que foi validado é exatamente o que vai ao ar.
# =====================================================================
name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:            # mudança só em documentação não gera deploy
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # -------------------------------------------------------------------
  build:
    name: 1. Build
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências (NuGet)
        run: dotnet restore ResiduosApi.sln

      - name: Compilar em Release
        run: dotnet build ResiduosApi.sln -c Release --no-restore

      - name: Gerar pacote publicável
        run: dotnet publish src/ResiduosApi/ResiduosApi.csproj -c Release --no-build -o publish

      - name: Guardar artefato do build
        uses: actions/upload-artifact@v7
        with:
          name: residuos-api-${{ github.sha }}
          path: publish
          retention-days: 7

  # -------------------------------------------------------------------
  test:
    name: 2. Testes automatizados
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Testes de integração (xUnit + WebApplicationFactory + EF InMemory).
      # O logger "GitHubActions" publica a tabela de resultados no resumo do job.
      - name: Executar testes (xUnit)
        run: >
          dotnet test ResiduosApi.sln -c Release
          --logger "GitHubActions;summary-include-passed=true"
          --logger "trx;LogFileName=resultado-testes.trx"
          --results-directory TestResults

      - name: Guardar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultado-testes
          path: TestResults

  # -------------------------------------------------------------------
  docker:
    name: 3. Imagem Docker (GHCR)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nome.outputs.image }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Definir nome e tag da imagem
        id: nome
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"       # GHCR exige minúsculas
          TAG="sha-${GITHUB_SHA::7}"
          {
            echo "repo=$REPO"
            echo "tag=$TAG"
            echo "image=$REPO:$TAG"
          } >> "$GITHUB_OUTPUT"

      # QEMU + Buildx: gera a imagem para amd64 (servidores Linux) e arm64 (Mac Apple Silicon).
      - name: Preparar QEMU
        uses: docker/setup-qemu-action@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.nome.outputs.tag }}
          tags: |
            ${{ steps.nome.outputs.repo }}:${{ steps.nome.outputs.tag }}
            ${{ steps.nome.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Cidades ESGInteligentes - API de Gestão de Resíduos
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo da imagem
        run: |
          {
            echo "### 🐳 Imagem publicada no GHCR"
            echo "| | |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.nome.outputs.image }}\` |"
            echo "| Também marcada como | \`latest\` |"
            echo "| Plataformas | linux/amd64, linux/arm64 |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  deploy-staging:
    name: 4. Deploy Staging
    needs: docker
    runs-on: self-hosted
    concurrency: deploy-staging
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: http://localhost:8081
    env:
      API_IMAGE: ${{ needs.docker.outputs.image }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - name: Baixar o código (compose e scripts)
        uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy com Docker Compose
        run: ./deploy/deploy.sh staging "$API_IMAGE"

      - name: Smoke test do ambiente
        run: |
          {
            echo "### 🧪 Staging no ar — http://localhost:8081"
            echo "Imagem: \`$API_IMAGE\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          ./deploy/smoke-test.sh http://localhost:8081 "$GITHUB_STEP_SUMMARY"

      - name: Logout do registry
        if: always()
        run: docker logout ghcr.io

  # -------------------------------------------------------------------
  # O Environment "production" exige aprovação manual no GitHub antes
  # deste job começar (Settings > Environments > Required reviewers).
  deploy-production:
    name: 5. Deploy Produção
    needs: [docker, deploy-staging]
    runs-on: self-hosted
    concurrency: deploy-production
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://localhost:8080
    env:
      API_IMAGE: ${{ needs.docker.outputs.image }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - name: Baixar o código (compose e scripts)
        uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy com Docker Compose
        run: ./deploy/deploy.sh production "$API_IMAGE"

      - name: Smoke test do ambiente
        run: |
          {
            echo "### 🚀 Produção no ar — http://localhost:8080"
            echo "Imagem: \`$API_IMAGE\` (a mesma validada em staging)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          ./deploy/smoke-test.sh http://localhost:8080 "$GITHUB_STEP_SUMMARY"

      - name: Logout do registry
        if: always()
        run: docker logout ghcr.io
